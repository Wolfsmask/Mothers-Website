<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — {{name}}</title>
<meta name="description" content="REPLACE ME — one sentence describing the business, for Google results.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="index.html" data-site-name>Company Name</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">Menu</button>
    <nav class="nav" id="primary-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main id="main">

  <section class="section">
    <div class="wrap">
      <h1>Contact</h1>
      <p class="section__lead">Questions about an item, a custom order, or anything else — send a message.</p>
      <ul class="contact-list" id="contact-details"></ul>

      <form class="form" id="contact-form" novalidate>
        <div class="field">
          <label for="f-name">Your name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="f-email">Your email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="f-message">Message</label>
          <textarea id="f-message" name="message" required></textarea>
        </div>
        <div class="visually-hidden" aria-hidden="true">
          <label for="f-company">Do not fill this in</label>
          <input id="f-company" name="company" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="btn" type="submit">Send message</button>
        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <span>&copy; <span id="year">2026</span> <span data-site-name>Company Name</span>. All rights reserved.</span>
    <span class="site-footer__links">
      <a href="contact.html">Contact</a>
    </span>
  </div>
</footer>

<script src="data/site-data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
